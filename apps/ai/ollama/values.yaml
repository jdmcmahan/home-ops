---
ollama:
  gpu:
    enabled: true
  models:
    pull:
      - qwen3.5:9b
      - qwen3.5:35b
  clean: true

extraEnv:
  - name: OLLAMA_CONTEXT_LENGTH
    value: "64000"
  - name: OLLAMA_KEEP_ALIVE
    value: "30m"

httpRoute:
  enabled: true
  hostnames: ["ollama.mcmahan.io"]
  parentRefs:
    - name: local
      namespace: traefik
      sectionName: websecure

persistentVolume:
  enabled: true
  size: 120Gi
  storageClass: ceph-block
