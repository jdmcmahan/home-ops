---
ollama:
  gpu:
    enabled: true
  models:
    pull:
      - qwen3.5:9b
      - qwen3.5:35b
  clean: true

service:
  type: LoadBalancer

httpRoute:
  enabled: true
  hostnames: ["ollama.mcmahan.io"]
  parentRefs:
    - name: local
      namespace: traefik
      sectionName: websecure

persistentVolume:
  enabled: true
  size: 120Gi
  storageClass: ceph-block
