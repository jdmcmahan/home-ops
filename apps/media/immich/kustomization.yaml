---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - postgres.yaml
  - volsync-immichframe.yaml

helmCharts:
  - name: immich
    repo: oci://ghcr.io/immich-app/immich-charts
    version: 0.13.2
    releaseName: immich
    namespace: immich
    valuesFile: values-immich.yaml
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    version: 5.2.1
    releaseName: immichframe
    namespace: immich
    valuesFile: values-immichframe.yaml
