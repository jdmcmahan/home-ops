---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  immichframe:
    containers:
      app:
        image:
          repository: ghcr.io/immichframe/immichframe
          tag: v1.0.39.0@sha256:b4bd2ac6ec75c0117a24bd627dc0b449d485ac87ec3a410c73d5db05a4bbfcaf
          pullPolicy: IfNotPresent
        env:
          TZ: "America/Chicago"

defaultPodOptions:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"

service:
  web:
    enabled: true
    controller: immichframe
    type: LoadBalancer
    ports:
      http:
        port: 8080

route:
  immichframe:
    hostnames: ["immichframe.mcmahan.io"]
    parentRefs:
      - name: remote
        namespace: traefik
        sectionName: websecure
    rules:
      - backendRefs:
          - identifier: web
            port: 8080

persistence:
  config:
    enabled: true
    existingClaim: immichframe-config
    advancedMounts:
      immichframe:
        app:
          - path: /app/Config
