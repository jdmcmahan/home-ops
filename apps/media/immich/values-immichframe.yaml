---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  immichframe:
    containers:
      app:
        image:
          repository: ghcr.io/immichframe/immichframe
          tag: v1.0.38.0@sha256:ac01a3afffc170d4a8085476302fd7963ad873955f8dda02a47290de9011c562
          pullPolicy: IfNotPresent
        env:
          TZ: "America/Chicago"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

defaultPodOptions:
  securityContext:
    fsGroupChangePolicy: "OnRootMismatch"
    runAsNonRoot: true

service:
  web:
    enabled: true
    controller: immichframe
    type: LoadBalancer
    ports:
      http:
        port: 8080

route:
  immichframe:
    hostnames: ["immichframe.mcmahan.io"]
    parentRefs:
      - name: remote
        namespace: traefik
        sectionName: websecure
    rules:
      - backendRefs:
          - identifier: web
            port: 8080

persistence:
  config:
    enabled: true
    existingClaim: immichframe-config
    advancedMounts:
      immichframe:
        app:
          - path: /config
  config-file:
    type: secret
    name: immichframe-config
    globalMounts:
      - path: /app/Config/Settings.yml
        subPath: Settings.yml
        readOnly: true
