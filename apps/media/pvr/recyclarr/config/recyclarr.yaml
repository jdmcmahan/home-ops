---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
sonarr:
  sonarr:
    base_url: http://sonarr-web.sonarr.svc
    api_key: !env_var SONARR_API_KEY

    media_naming:
      series: default
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    delete_old_custom_formats: true

    quality_definition:
      type: series

    quality_profiles:
      - name: UHD 2160p
        trash_id: e58cf4e090184db3b3d7c79c1a9e9b4a # Base Profile
        reset_unmatched_scores:
          enabled: true
        quality_sort: top
        qualities:
          - name: Bluray-2160p Remux
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: HDTV-2160p
          - name: Bluray-1080p Remux
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p
          - name: Bluray-480p
          - name: WEB 480p
            qualities:
              - WEBDL-480p
              - WEBRip-480p
          - name: DVD
          - name: SDTV
      - name: HD 1080p
        trash_id: e58cf4e090184db3b3d7c79c1a9e9b4a # Base Profile
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p
          - name: Bluray-480p
          - name: WEB 480p
            qualities:
              - WEBDL-480p
              - WEBRip-480p
          - name: DVD
          - name: SDTV
      - name: HD 1080p - Anime
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        min_format_score: 0
        score_set: anime-sonarr
        quality_sort: top
        qualities:
          - name: Bluray-1080p
            qualities:
              - Bluray-1080p Remux
              - Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
          - name: Bluray-480p
          - name: WEB 480p
            qualities:
              - WEBDL-480p
              - WEBRip-480p
          - name: DVD
          - name: SDTV

    custom_format_groups:
      add:
        - trash_id: d776a1ea912a117d66d83b880ff2055d # [HDR Formats] DV (w/o HDR fallback)

        - trash_id: e1053c0ef622df3749fa43c22865663a # [HDR Formats] SDR
          select:
            - 2016d1676f5ee13a5b7257ff86ac9a93 # SDR

        - trash_id: b4a4353e3b3e6789dbef07677ff23686 # [Release Groups] HQ
          select_all: true

        - trash_id: 35fb4585dcd9e2a5ac732e4309f5a45a # [Streaming Services] Asian

        - trash_id: f60f4401ce880aad62e9d21c8bb6b91a # [Streaming Services] Dutch

        - trash_id: ddab3095a5d2f436f369263840af34f9 # [Streaming Services] UK

        - trash_id: 7832db22b71ab669458c17a2850d6913 # [Streaming Services] Miscellaneous
          select_all: true

        - trash_id: a4a95b9f7bdf10dcb005e765155e4d24 # [Optional] Series Versions
          select_all: true

        - trash_id: 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD
          assign_scores_to:
            - name: HD 1080p

        - trash_id: e3f37512790f00d0e89e54fe5e790d1c # [Optional] Golden Rule UHD
          assign_scores_to:
            - name: UHD 2160p

        - trash_id: f4a0410a1df109a66d6e47dcadcce014 # [Optional] Miscellaneous
          select:
            - d7c747094a7c65f4c2de083c24899e8b # FreeLeech

        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
          select_all: true

    custom_formats:
      - trash_ids:
          # Anime CF/Scoring
          - 949c16fe0a8147f50ba82cc2df9411c9 # Anime BD Tier 01 (Top SeaDex Muxers)
          - ed7f1e315e000aef424a58517fa48727 # Anime BD Tier 02 (SeaDex Muxers)
