---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  qbittorrent:
    type: statefulset
    pod:
      securityContext:
        fsGroup: 979
        fsGroupChangePolicy: "OnRootMismatch"
    initContainers:
      gluetun-config-staging:
        image:
          repository: docker.io/busybox
          tag: 1.38.0
        command:
          - /bin/sh
          - -c
          - cp /staging/servers.json /gluetun/servers.json
      gluetun:
        dependsOn:
          - gluetun-config-staging
        image:
          repository: docker.io/qmcgaw/gluetun
          tag: v3.41.3
        restartPolicy: Always
        env:
          TZ: "America/Chicago"
          VPN_SERVICE_PROVIDER: mullvad
          VPN_TYPE: wireguard
          SERVER_CITIES: "Chicago IL"
          FIREWALL_INPUT_PORTS: "8080,17871"
        envFrom:
          - secretRef:
              name: gluetun-mullvad-credentials
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - NET_ADMIN
        resources:
          requests:
            devic.es/tun: "1"
          limits:
            devic.es/tun: "1"
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/qbittorrent
          tag: 5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
          pullPolicy: IfNotPresent
        env:
          TZ: "America/Chicago"
          QBT_WEBUI_PORT: 8080
          QBT_TORRENTING_PORT: 51820
        securityContext:
          runAsUser: 979
          runAsGroup: 979
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

service:
  web:
    enabled: true
    suffix: web
    controller: qbittorrent
    type: LoadBalancer
    ports:
      http:
        port: 80
        targetPort: 8080

route:
  qbittorrent:
    hostnames: ["qbittorrent.mcmahan.io"]
    parentRefs:
      - name: local
        namespace: traefik
        sectionName: websecure
    rules:
      - backendRefs:
          - identifier: web
            port: 80

persistence:
  gluetun-staging:
    enabled: true
    type: configMap
    name: gluetun-configmap
    advancedMounts:
      qbittorrent:
        gluetun-config-staging:
          - path: /staging/servers.json
            subPath: servers.json
            readOnly: true
  gluetun:
    enabled: true
    type: emptyDir
    advancedMounts:
      qbittorrent:
        gluetun-config-staging:
          - path: /gluetun
        gluetun:
          - path: /gluetun
  config:
    enabled: true
    existingClaim: qbittorrent-config
    advancedMounts:
      qbittorrent:
        app:
          - path: /config
  media:
    enabled: true
    type: nfs
    server: new-peepums
    path: /volume1/media/staging/torrents
    advancedMounts:
      qbittorrent:
        app:
          - path: /data/staging/torrents
