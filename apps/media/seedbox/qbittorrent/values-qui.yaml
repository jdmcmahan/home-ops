---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  qui:
    containers:
      app:
        image:
          repository: ghcr.io/autobrr/qui
          tag: v1.31.0@sha256:74ac327d7e0cad1309cbfe3d024bfc9e8136b9926a1450d2f6192c6970f66362
          pullPolicy: IfNotPresent
        env:
          TZ: "America/Chicago"
          QUI__OIDC_ENABLED: true
          QUI__OIDC_ISSUER: https://auth.mcmahan.io/application/o/qui/
          QUI__OIDC_REDIRECT_URL: https://qui.mcmahan.io/api/auth/oidc/callback
          QUI__OIDC_DISABLE_BUILT_IN_LOGIN: true
          QUI__HOST: 0.0.0.0
          QUI__PORT: &port 80
          QUI__METRICS_ENABLED: true
          QUI__METRICS_HOST: 0.0.0.0
        envFrom:
          - secretRef:
              name: qui-oidc
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

defaultPodOptions:
  securityContext:
    runAsUser: 979
    runAsGroup: 979
    fsGroup: 979
    fsGroupChangePolicy: "OnRootMismatch"
    runAsNonRoot: true

service:
  web:
    enabled: true
    controller: qui
    type: LoadBalancer
    ports:
      http:
        port: *port
  metrics:
    enabled: true
    controller: qui
    ports:
      metrics:
        port: 9074

serviceMonitor:
  metrics:
    serviceName: qui-metrics
    endpoints:
      - port: metrics

route:
  qui:
    hostnames: ["qui.mcmahan.io"]
    parentRefs:
      - name: local
        namespace: traefik
        sectionName: websecure
    rules:
      - backendRefs:
          - identifier: web
            port: *port

persistence:
  config:
    enabled: true
    existingClaim: qui-config
    advancedMounts:
      qui:
        app:
          - path: /config
  media:
    enabled: true
    type: nfs
    server: new-peepums
    path: /volume1/media/staging/torrents
    globalMounts:
      - path: /data/staging/torrents
