      apiVersion: v1alpha1
      kind: UnattendedInstallConfig
      provisioning:
        diskSelector:
          match: disk.dev_path == "/dev/nvme0n1"
  - name: hostname
    inline: |
      apiVersion: v1alpha1
      kind: HostnameConfig
      hostname: spidermom
  - name: limit-ephemeral-volume
    inline: |
      apiVersion: v1alpha1
      kind: VolumeConfig
      name: EPHEMERAL
      provisioning:
        maxSize: 240GiB
  - name: ai-models-volume
    inline: |
      apiVersion: v1alpha1
      kind: UserVolumeConfig
      name: ai-models
      provisioning:
        diskSelector:
          match: disk.transport == 'nvme'
        minSize: 240GiB
        maxSize: 500GiB
  - name: nvidia
    file: patches/nvidia.yaml
systemExtensions:
  - siderolabs/nonfree-kmod-nvidia-lts
  - siderolabs/nvidia-container-toolkit-lts
