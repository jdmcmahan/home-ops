  - 4c4c4544-0052-4610-8054-b3c04f4e5932
  - 4c4c4544-0052-4e10-8054-b3c04f4e5932
  - 4c4c4544-0052-4810-8054-b3c04f4e5932
---
kind: Workers
name: ai
machines:
  - ad064900-a236-11f1-926b-11bbce7a6b00
---
kind: Machine
name: 4c4c4544-004a-4310-8042-b4c04f365132
patches:
  - name: install-disk
    inline: |
      apiVersion: v1alpha1
      kind: UnattendedInstallConfig
      provisioning:
        diskSelector:
          match: disk.dev_path == "/dev/nvme0n1"
  - name: hostname
    inline: |
      apiVersion: v1alpha1
      kind: HostnameConfig
      hostname: vision-eightfold
  - name: kexec-disable
    file: patches/kexec-disable.yaml
  - name: gc-threshold
    file: patches/gc-threshold.yaml
  - name: cloudflared-quic
    file: patches/cloudflared-quic.yaml
systemExtensions:
  - siderolabs/intel-ucode
  - siderolabs/i915
