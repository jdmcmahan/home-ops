---
kind: Cluster
name: vriska
kubernetes:
  version: v1.36.4
talos:
  version: v1.14.0
features:
  enableWorkloadProxy: true
  backupConfiguration:
    interval: 24h
patches:
  - name: control-plane-workers
    file: patches/control-plane-workers.yaml
  - name: cilium-override
    file: patches/cilium-override.yaml
---
kind: ControlPlane
machines:
  - 4c4c4544-004a-4310-8042-b4c04f365132
  - 4c4c4544-0043-4210-8035-b4c04f365132
  - 4c4c4544-0039-4a10-8048-b9c04f305432
---
kind: Workers
name: storage
